<!DOCTYPE html>
<html lang="pt-br" class="h-full antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Observe - Tracking em tempo real</title>

  <style>
    .car-marker { --car: #10b981; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
    .car-marker .car-body { fill: var(--car); transition: fill .3s; }
    .car-marker svg { display: block; }
  </style>
  
  <!-- MapLibre & Turf -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            border: "hsl(240 5.9% 90%)",
            input: "hsl(240 5.9% 90%)",
            ring: "hsl(240 5.9% 10%)",
            background: "hsl(0 0% 100%)",
            foreground: "hsl(240 10% 3.9%)",
            primary: {
              DEFAULT: "hsl(240 5.9% 10%)",
              foreground: "hsl(0 0% 98%)",
            },
            muted: {
              DEFAULT: "hsl(240 4.8% 95.9%)",
              foreground: "hsl(240 3.8% 46.1%)",
            },
          }
        }
      }
    }
  </script>
</head>
<body class="h-full m-0 bg-background text-foreground overflow-hidden">

  <!-- Painel -->
  <div id="panel" style="padding-bottom: max(1rem, env(safe-area-inset-bottom));" class="absolute z-10 w-full bottom-0 md:bottom-auto md:top-4 md:left-4 md:w-[320px] bg-background border-t md:border border-border shadow-md px-4 pt-4 md:p-5 flex flex-col gap-4 max-h-[60dvh] md:max-h-[calc(100dvh-2rem)] overflow-y-auto rounded-none">

    <!-- Status: sempre visível, mesmo com o painel recolhido no celular -->
    <div class="flex items-center gap-3">
      <div class="flex-1 flex flex-col gap-1.5">
        <div class="text-sm flex justify-between">
          <span class="font-medium text-muted-foreground">Alarme:</span>
          <span id="alarmStatus" class="font-bold text-muted-foreground">inativo</span>
        </div>
        <div class="text-sm flex justify-between">
          <span class="font-medium text-muted-foreground">Status:</span>
          <span id="status" class="font-bold text-emerald-600">Conectando...</span>
        </div>
      </div>
      <button id="panelToggle" type="button" aria-expanded="false" aria-controls="panelBody" class="md:hidden inline-flex items-center justify-center border border-input bg-background shadow-sm hover:bg-muted h-11 px-4 text-sm font-medium rounded-none">
        Opções
      </button>
    </div>

    <!-- Controles: recolhidos por padrão no celular, sempre abertos no desktop -->
    <div id="panelBody" class="hidden md:flex flex-col gap-4">
      <hr class="border-border" />

      <div class="space-y-1.5">
        <label for="rangeSelect" class="text-sm font-medium leading-none">Histórico (últimos...)</label>
        <select id="rangeSelect" class="flex h-11 md:h-9 w-full rounded-none border border-input bg-transparent px-3 py-1 text-base md:text-sm shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">
          <option value="">-- selecione --</option>
          <option value="30">30 min</option>
          <option value="40">40 min</option>
          <option value="50">50 min</option>
          <option value="60">1 hora</option>
          <option value="120">2 horas</option>
        </select>
      </div>

      <div class="space-y-1.5">
        <label for="polygonInput" class="text-sm font-medium leading-none">Área de restrição</label>
        <textarea id="polygonInput" placeholder='GeoJSON Polygon&#10;Ex: [[[-47.9,-22.0],[-47.8,-22.0],...]]' class="flex min-h-[80px] w-full rounded-none border border-input bg-transparent px-3 py-2 text-base md:text-xs font-mono shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring resize-y"></textarea>
        <button id="applyPolygon" class="inline-flex items-center justify-center rounded-none text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring bg-primary text-primary-foreground shadow hover:bg-primary/90 h-11 md:h-9 px-4 py-2 w-full">
          Aplicar área
        </button>
      </div>

      <button id="enableSound" class="inline-flex items-center justify-center rounded-none text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring border border-input bg-background shadow-sm hover:bg-muted hover:text-foreground h-11 md:h-9 px-4 py-2 w-full">
        Ativar som (clique uma vez)
      </button>
    </div>
  </div>

  <!-- Mapa -->
  <div id="map" class="absolute inset-0 w-full h-full"></div>

<script>
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '&copy; OpenStreetMap contributors'
      }
    },
    layers: [
      { id: 'osm', type: 'raster', source: 'osm' }
    ]
  },
  center: [-47.9, -22.0],
  zoom: 12
});

const COLOR_OK = '#10b981';
const COLOR_OUT = '#ef4444';

let restrictionPolygon = null;
const points = [];          // { lat, lng, outside }
let mapReady = false;

// --- Painel (recolher/expandir no celular) ---
const panelEl = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
const panelToggle = document.getElementById('panelToggle');
panelToggle.addEventListener('click', () => {
  const open = panelBody.classList.toggle('hidden') === false;
  panelToggle.setAttribute('aria-expanded', String(open));
  panelToggle.innerText = open ? 'Fechar' : 'Opções';
});

// Espaço ocupado pelo painel, para o carro não ficar escondido atrás dele
function mapPadding() {
  if (window.matchMedia('(min-width: 768px)').matches) {
    return { top: 0, bottom: 0, left: panelEl.offsetWidth + 32, right: 0 };
  }
  return { top: 0, bottom: panelEl.offsetHeight, left: 0, right: 0 };
}

// --- Carrinho ---
const carEl = document.createElement('div');
carEl.className = 'car-marker';
carEl.innerHTML = `
  <svg viewBox="0 0 28 48" width="28" height="48" xmlns="http://www.w3.org/2000/svg" aria-label="Veículo">
    <rect x="1" y="9"  width="5" height="10" rx="2" fill="#111827"/>
    <rect x="22" y="9" width="5" height="10" rx="2" fill="#111827"/>
    <rect x="1" y="30" width="5" height="10" rx="2" fill="#111827"/>
    <rect x="22" y="30" width="5" height="10" rx="2" fill="#111827"/>
    <rect class="car-body" x="4" y="2" width="20" height="44" rx="9" stroke="#fff" stroke-width="2"/>
    <path d="M8 17 Q14 12 20 17 L19 23 H9 Z" fill="#1f2937"/>
    <rect x="9" y="25" width="10" height="9" rx="2" fill="rgba(255,255,255,.35)"/>
    <path d="M9 39 H19 L20 36 H8 Z" fill="#1f2937"/>
    <circle cx="8.5" cy="4.5" r="1.4" fill="#fde68a"/>
    <circle cx="19.5" cy="4.5" r="1.4" fill="#fde68a"/>
  </svg>`;

const carMarker = new maplibregl.Marker({
  element: carEl,
  rotationAlignment: 'map',
  pitchAlignment: 'map'
});
let carPos = null;      // posição atualmente exibida [lng, lat]
let carAnim = null;

function setCarColor(outside) {
  carEl.style.setProperty('--car', outside ? COLOR_OUT : COLOR_OK);
}

// Move o carro (com deslize suave quando animate = true) e gira na direção do movimento
function moveCar(lat, lng, outside, animate) {
  const to = [lng, lat];
  setCarColor(outside);
  if (carAnim) cancelAnimationFrame(carAnim);

  if (carPos && turf.distance(carPos, to, { units: 'meters' }) > 1) {
    carMarker.setRotation(turf.bearing(carPos, to));
  }

  if (!carPos) carMarker.setLngLat(to).addTo(map);

  if (!animate || !carPos) {
    carPos = to;
    carMarker.setLngLat(to);
    return;
  }

  const from = carPos;
  const start = performance.now();
  const duration = 900;
  const step = (now) => {
    const t = Math.min((now - start) / duration, 1);
    carPos = [from[0] + (to[0] - from[0]) * t, from[1] + (to[1] - from[1]) * t];
    carMarker.setLngLat(carPos);
    carAnim = t < 1 ? requestAnimationFrame(step) : null;
  };
  carAnim = requestAnimationFrame(step);
}

// --- Rastro e pontos ---
function trailData() {
  // um segmento por par de pontos, colorido conforme o ponto de chegada
  const features = [];
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i];
    features.push({
      type: 'Feature',
      properties: { outside: b.outside },
      geometry: { type: 'LineString', coordinates: [[a.lng, a.lat], [b.lng, b.lat]] }
    });
  }
  return { type: 'FeatureCollection', features };
}

function pointsData() {
  return {
    type: 'FeatureCollection',
    features: points.map(p => ({
      type: 'Feature',
      properties: { outside: p.outside },
      geometry: { type: 'Point', coordinates: [p.lng, p.lat] }
    }))
  };
}

function renderTrail() {
  if (!mapReady) return;
  map.getSource('trail').setData(trailData());
  map.getSource('points').setData(pointsData());
}

map.on('load', () => {
  const colorExpr = ['case', ['get', 'outside'], COLOR_OUT, COLOR_OK];

  map.addSource('trail', { type: 'geojson', data: trailData() });
  map.addSource('points', { type: 'geojson', data: pointsData() });

  map.addLayer({
    id: 'trail-casing',
    type: 'line',
    source: 'trail',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffffff', 'line-width': 8, 'line-opacity': 0.9 }
  });
  map.addLayer({
    id: 'trail-line',
    type: 'line',
    source: 'trail',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': colorExpr, 'line-width': 4 }
  });
  map.addLayer({
    id: 'trail-points',
    type: 'circle',
    source: 'points',
    paint: {
      'circle-radius': 4,
      'circle-color': colorExpr,
      'circle-stroke-color': '#ffffff',
      'circle-stroke-width': 1.5
    }
  });

  mapReady = true;
  renderTrail();
});

function addPoint(lat, lng, { animate = false } = {}) {
  const outside = isOutside(lat, lng);
  points.push({ lat, lng, outside });
  renderTrail();
  moveCar(lat, lng, outside, animate);
}

function clearPoints() {
  points.length = 0;
  if (carAnim) cancelAnimationFrame(carAnim);
  carAnim = null;
  carPos = null;
  carMarker.remove();
  renderTrail();
}

function recolorAll() {
  points.forEach(p => { p.outside = isOutside(p.lat, p.lng); });
  renderTrail();
  const last = points[points.length - 1];
  if (last) setCarColor(last.outside);
}

function isOutside(lat, lng) {
  if (!restrictionPolygon) return false;
  const pt = turf.point([lng, lat]);
  return !turf.booleanPointInPolygon(pt, restrictionPolygon);
}

document.getElementById('applyPolygon').addEventListener('click', () => {
  const raw = document.getElementById('polygonInput').value.trim();
  if (!raw) {
    restrictionPolygon = null;
    if (map.getLayer('restriction-fill')) {
      map.removeLayer('restriction-fill');
      map.removeLayer('restriction-line');
      map.removeSource('restriction');
    }
    recolorAll();
    stopAlarm();
    return;
  }

  try {
    const parsed = JSON.parse(raw);
    let coordsArray = null;

    if (Array.isArray(parsed)) {
      // user pasted coordinates array directly
      coordsArray = parsed;
    } else if (parsed.type === 'FeatureCollection') {
      const f = parsed.features && parsed.features[0];
      if (!f) throw new Error('FeatureCollection sem features');
      if (!f.geometry) throw new Error('Feature sem geometry');
      if (f.geometry.type === 'Polygon') coordsArray = f.geometry.coordinates;
      else if (f.geometry.type === 'MultiPolygon') coordsArray = f.geometry.coordinates[0];
    } else if (parsed.type === 'Feature') {
      if (!parsed.geometry) throw new Error('Feature sem geometry');
      if (parsed.geometry.type === 'Polygon') coordsArray = parsed.geometry.coordinates;
      else if (parsed.geometry.type === 'MultiPolygon') coordsArray = parsed.geometry.coordinates[0];
    } else if (parsed.type === 'Polygon') {
      coordsArray = parsed.coordinates;
    } else if (parsed.type === 'MultiPolygon') {
      coordsArray = parsed.coordinates[0];
    } else {
      throw new Error('Formato GeoJSON não suportado');
    }

    if (!coordsArray) throw new Error('Não foi possível extrair coordenadas do GeoJSON');

    restrictionPolygon = turf.polygon(coordsArray);

    const geojson = { type: 'Feature', geometry: restrictionPolygon.geometry, properties: {} };

    if (map.getSource('restriction')) {
      map.getSource('restriction').setData(geojson);
    } else {
      map.addSource('restriction', { type: 'geojson', data: geojson });
      map.addLayer({
        id: 'restriction-fill',
        type: 'fill',
        source: 'restriction',
        paint: { 'fill-color': '#0000ff', 'fill-opacity': 0.1 }
      }, 'trail-casing');
      map.addLayer({
        id: 'restriction-line',
        type: 'line',
        source: 'restriction',
        paint: { 'line-color': '#0000ff', 'line-width': 2 }
      }, 'trail-casing');
    }

    recolorAll();
    // após aplicar, checar último ponto atual (se houver) para disparar alarme
    if (points.length > 0) {
      const last = points[points.length - 1];
      if (last.outside) startAlarm(); else stopAlarm();
    } else {
      stopAlarm();
    }
  } catch (e) {
    alert('GeoJSON inválido: ' + e.message);
  }
});

document.getElementById('rangeSelect').addEventListener('change', async (e) => {
  const minutes = e.target.value;
  if (!minutes) return;

  const end = new Date();
  const init = new Date(end.getTime() - minutes * 60 * 1000);

  let data;
  try {
    const res = await fetch(`/track?init=${init.toISOString()}&end=${end.toISOString()}`);
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (err) {
    alert('Não foi possível carregar o histórico: ' + err.message);
    return;
  }

  clearPoints();
  data.forEach(loc => addPoint(loc.latitude, loc.longitude));

  if (data.length > 0) {
    // enquadra todo o percurso no espaço livre do mapa
    const bounds = new maplibregl.LngLatBounds();
    data.forEach(loc => bounds.extend([loc.longitude, loc.latitude]));
    map.fitBounds(bounds, {
      padding: {
        top: 60, right: 60,
        bottom: 60 + mapPadding().bottom,
        left: 60 + mapPadding().left
      },
      maxZoom: 16
    });
  }
  checkLastForAlarm(data);
});

// SSE e Updates de Status
const statusEl = document.getElementById('status');
const source = new EventSource('/location_now');

source.onopen = () => {
  statusEl.innerText = 'Recebendo dados';
  statusEl.className = 'font-bold text-emerald-600';
};

source.onerror = () => {
  statusEl.innerText = 'Conexão perdida';
  statusEl.className = 'font-bold text-red-600';
};

source.onmessage = (event) => {
  const location = JSON.parse(event.data);
  addPoint(location.latitude, location.longitude, { animate: true });
  map.easeTo({ center: [location.longitude, location.latitude], duration: 900, padding: mapPadding() });
  
  if (restrictionPolygon && isOutside(location.latitude, location.longitude)) {
    startAlarm();
  } else {
    stopAlarm();
  }
};

async function checkLastForAlarm(points) {
  if (!restrictionPolygon) return stopAlarm();
  if (!points || points.length === 0) return stopAlarm();
  const last = points[points.length - 1];
  if (isOutside(last.latitude, last.longitude)) startAlarm(); else stopAlarm();
}

// --- Alarme sonoro ---
let audioCtx = null;
let oscillator = null;
let gainNode = null;
let alarmPlaying = false;
let alarmEnabled = false;

const alarmStatusEl = document.getElementById('alarmStatus');

document.getElementById('enableSound').addEventListener('click', async () => {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  try {
    await audioCtx.resume();
    alarmEnabled = true;
    alarmStatusEl.innerText = 'pronto';
    alarmStatusEl.className = 'font-bold text-emerald-600';
  } catch (e) {
    alarmStatusEl.innerText = 'falha no áudio';
    alarmStatusEl.className = 'font-bold text-amber-500';
  }
});

function startAlarm() {
  if (!restrictionPolygon) return;
  if (!alarmEnabled) {
    alarmStatusEl.innerText = 'requer clique';
    alarmStatusEl.className = 'font-bold text-amber-500';
    return;
  }
  if (alarmPlaying) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  oscillator = audioCtx.createOscillator();
  gainNode = audioCtx.createGain();
  oscillator.type = 'sawtooth';
  oscillator.frequency.value = 1200;
  gainNode.gain.value = 0.0001;
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.start();
  
  gainNode.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 0.02);
  alarmPlaying = true;
  alarmStatusEl.innerText = 'FORA DA ÁREA';
  alarmStatusEl.className = 'font-bold text-red-600 animate-pulse';
}

function stopAlarm() {
  if (!alarmPlaying) return;
  try {
    gainNode.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.02);
    oscillator.stop(audioCtx.currentTime + 0.05);
  } catch (e) {}
  setTimeout(() => {
    try { oscillator.disconnect(); } catch(e){}
    try { gainNode.disconnect(); } catch(e){}
    oscillator = null; gainNode = null;
    alarmPlaying = false;
    alarmStatusEl.innerText = 'inativo';
    alarmStatusEl.className = 'font-bold text-muted-foreground';
  }, 100);
}
</script>

</body>
</html>
